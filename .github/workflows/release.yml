name: build-and-release

# 目前手动触发：Actions 页面 -> build-and-release -> Run workflow。
# 想改成“打 tag 自动发布”，把下面的 workflow_dispatch 换成：
#   push:
#     tags: ["v*"]

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the exe
        run: >
          python -m PyInstaller --noconfirm --windowed --onefile
          --name 作业看台 --icon quill.ico
          --add-data "quill.ico;." --add-data "update_url.txt;."
          app.py

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist/作业看台.exe' -Algorithm SHA256).Hash
          "$hash *作业看台.exe" | Out-File 'dist/作业看台.exe.sha256' -Encoding utf8
          Write-Output "sha256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: 作业看台
          path: |
            dist/作业看台.exe
            dist/作业看台.exe.sha256
