name: build-and-release

# 打一个 v1.0.17 这样的 tag 会自动构建并发布 Release。
# 也可以在 Actions 页面手动 Run workflow，只构建并上传产物，不发版。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v1.0.20）"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the exe
        run: python build.py

      - name: Prepare assets
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/jobdesk.exe')) { throw 'jobdesk.exe was not built' }
          $hash = (Get-FileHash 'dist/jobdesk.exe' -Algorithm SHA256).Hash
          "$hash *jobdesk.exe" | Out-File 'dist/jobdesk.exe.sha256' -Encoding utf8
          Write-Output "sha256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: jobdesk
          path: |
            dist/jobdesk.exe
            dist/jobdesk.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/jobdesk.exe
            dist/jobdesk.exe.sha256
          generate_release_notes: true
