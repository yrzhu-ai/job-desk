name: build-and-release

# 打一个 v1.0.17 这样的 tag 会自动构建并发布 Release。
# 也可以在 Actions 页面手动 Run workflow，只构建并上传产物，不发版。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the exe
        run: python build.py

      - name: Prepare assets
        shell: pwsh
        run: |
          Copy-Item 'dist/作业看台.exe' 'dist/jobdesk.exe'
          $hash = (Get-FileHash 'dist/jobdesk.exe' -Algorithm SHA256).Hash
          "$hash *jobdesk.exe" | Out-File 'dist/jobdesk.exe.sha256' -Encoding utf8
          Write-Output "sha256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: jobdesk
          path: |
            dist/jobdesk.exe
            dist/jobdesk.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jobdesk.exe
            dist/jobdesk.exe.sha256
          generate_release_notes: true
